# Appelée par une redirection navigateur depuis Discord OAuth : aucun header
# Authorization n'est envoyé. Avec le défaut (verify_jwt = true), la passerelle
# renvoie 401 avant même d'exécuter la fonction et l'attribution du rôle échoue.
[functions.wavacademy-claim-callback]
verify_jwt = false

# Appelée en fetch direct depuis /claim/:token (page publique, visiteur non
# connecté). La clé anon est bien envoyée, mais ce n'est pas un JWT de session.
[functions.wavacademy-claim-status]
verify_jwt = false

# Relais d'images WavStats. Publique et sans secret : elle ne fait que rejouer
# une image déjà publique, en ajoutant l'en-tête CORS qui manque en amont. Le
# domaine et le chemin sont en liste blanche stricte côté fonction.
[functions.image-proxy]
verify_jwt = false
